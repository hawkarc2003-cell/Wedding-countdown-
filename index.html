<script>

/* ---------------------------
   Falling hearts & sparkles
---------------------------- */

const particles = document.getElementById("particles");

const symbols = ["♡","♥","✦","·","✧"];

for(let i=0;i<45;i++){

    const p = document.createElement("div");

    p.className = "particle";

    p.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];

    p.style.left = Math.random()*100 + "%";

    p.style.fontSize = (8 + Math.random()*13) + "px";

    p.style.animationDuration = (5 + Math.random()*8) + "s";

    p.style.animationDelay = (-Math.random()*10) + "s";

    particles.appendChild(p);
}


/* ---------------------------
   Countdown
---------------------------- */

const weddingDate = new Date("September 17, 2026 00:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();

    const difference = weddingDate - now;

    if(difference <= 0){

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        return;
    }

    const days = Math.floor(difference/(1000*60*60*24));

    const hours = Math.floor(
        (difference%(1000*60*60*24))/(1000*60*60)
    );

    const minutes = Math.floor(
        (difference%(1000*60*60))/(1000*60)
    );

    const seconds = Math.floor(
        (difference%(1000*60))/1000
    );

    document.getElementById("days").textContent =
        String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,"0");
}

updateCountdown();

setInterval(updateCountdown,1000);


/* ---------------------------
   Music
---------------------------- */

const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click",()=>{

    if(music.paused){

        music.play();

        musicBtn.innerHTML = "🎵 Pause Music";

    }else{

        music.pause();

        musicBtn.innerHTML = "🎵 Play Music";
    }

});

   Likes
---------------------------- */

let likes = Number(localStorage.getItem("sofiyaLikes") || 0);

document.getElementById("likes").textContent = likes;

document.getElementById("likeBtn").addEventListener("click",()=>{

    likes++;

    localStorage.setItem("sofiyaLikes",likes);

    document.getElementById("likes").textContent = likes;

});
